name: CI/CD Pipeline - Build and Deploy

on:
  push:
    branches:
      - suman_dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      #- name: Set up Docker Buildx
        #uses: docker/setup-buildx-action@v3

      #- name: Log in to Docker Hub
        #uses: docker/login-action@v3
       # with:
         #username: ${{ secrets.DOCKERHUB_USERNAME }}
          #password: ${{ secrets.DOCKERHUB_TOKEN }}

     # - name: Build and Push Docker Image
        #uses: docker/build-push-action@v5
        #with:
         # context: .
         # file: ./Dockerfile
          #push: true
         # tags: |
          #  ${{ secrets.DOCKERHUB_USERNAME }}/node-sequelize-app:latest
           # ${{ secrets.DOCKERHUB_USERNAME }}/node-sequelize-app:${{ github.sha }}

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/sumanmakaut/Node-with-sequelize-orm/
            
            # Pull latest code from GitHub
            git pull origin suman_dev
            
            # Automatically write/update the .env.development file on the server using GitHub Secrets
            cat << 'EOF' > .env.development
            PORT=5000
            NODE_ENV=development
            DB_NAME=${{ secrets.DB_NAME }}
            USER=${{ secrets.DB_USER }}
            PASSWORD=${{ secrets.DB_PASSWORD }}
            HOST=${{ secrets.DB_HOST }}
            JWTSECRET=${{ secrets.JWTSECRET }}
            EOF
            
            # Pull new image and restart containers with rebuild
            docker compose --env-file .env.development up -d --build --remove-orphans